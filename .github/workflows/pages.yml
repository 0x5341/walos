name: Deploy demo and API docs to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: bash scripts/setup-sdk.sh
      - run: bash scripts/setup-wit-bindgen.sh
      - run: bash scripts/setup-runtime-tools.sh
      - run: bash scripts/setup-network-tools.sh
      - run: npm run build
      # Vite cleans dist; generate docs afterwards so both sites share one artifact.
      - run: npm run build:docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages -- --with-docs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy demo and API docs
        id: deployment
        uses: actions/deploy-pages@v5.0.1
