name: Validate WASI vertical slice
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    # Playwright 1.64.1 supports Ubuntu 26.04; ubuntu-latest can move to newer releases.
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      # The OS package must build/pack before any SDK or demo commands exist.
      - run: npm run build:os && npm pack --workspace @walos/os --dry-run
      - run: bash scripts/setup-sdk.sh
      - run: bash scripts/setup-wit-bindgen.sh
      - run: bash scripts/setup-runtime-tools.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run check:wit:p3
      - run: npm run check:wit
      - run: diff -ru wit/generated work/wit-generated
      - run: bash scripts/setup-network-tools.sh
      - run: npm run build
      - run: npm pack --workspace @walos/http-transport --workspace @walos/tailscale-socket --dry-run
      - run: npm run test:http
      - run: npm run check:network
      - run: npm run test:network
      - run: npm run test:tailscale-e2e
      - run: npm test
      - run: npm run test:production
      - run: npm run test:pages
      - run: npm run test:benchmark
      # Check reproducibility/integrity, without hardware-dependent performance gates.
      - run: npm run benchmark -- --trials 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-results
          path: work/benchmarks/latest.*
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results
