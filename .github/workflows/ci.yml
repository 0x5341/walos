name: Validate WASI vertical slice
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest can move to newer releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The OS package must build/pack before any SDK or demo commands exist.
      - run: npm run build:os && npm pack --workspace @walos/os --dry-run
      - run: bash scripts/setup-sdk.sh
      - run: bash scripts/setup-wit-bindgen.sh
      - run: bash scripts/setup-runtime-tools.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run check:wit:p3
      - run: npm run check:wit
      - run: diff -ru wit/generated work/wit-generated
      - run: npm run build
      - run: npm test
      - run: npm run test:production
      - run: npm run test:benchmark
      # Check reproducibility/integrity, without hardware-dependent performance gates.
      - run: npm run benchmark -- --trials 1
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: work/benchmarks/latest.*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
